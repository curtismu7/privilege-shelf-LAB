# Local Docker form. Publishes 127.0.0.1 only. Mock only: no tenant, no credentials, no outbound calls.
# Change the published port with HOST_PORT=<port> docker compose up --build -d
services:
  privilege-shelf:
    build: .
    image: privilege-shelf-lab:local
    environment:
      SHELF_URL: ${SHELF_URL:-https://local.ping-devops.com:8443/demo-shelf}
      MODE: mock
      LAB_PROXY_ORIGINS: "${LAB_PROXY_ORIGINS:-https://local.ping-devops.com:8443}"
      LAB_ALLOWED_HOSTS: "localhost:${HOST_PORT:-7828},127.0.0.1:${HOST_PORT:-7828},privilege-shelf.local.ping-devops.com:${HOST_PORT:-7828},local.ping-devops.com:8443"
      HOST_PORT: "${HOST_PORT:-7828}"
      PORT: "${HOST_PORT:-7828}"
    ports:
      - "127.0.0.1:${HOST_PORT:-7828}:${HOST_PORT:-7828}"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
